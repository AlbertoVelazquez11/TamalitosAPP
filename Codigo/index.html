<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>TamalitosAPP</title>

  <!-- ── Viewport iOS ── -->
  <!-- viewport-fit=cover: fondo extiende bajo Dynamic Island/Notch -->
  <!-- maximum-scale=1: previene zoom automático en iOS -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- ── Meta tags obligatorios para PWA en iOS Safari ── -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- black-translucent: la barra de estado de iOS queda superpuesta sobre la app -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TamalitosAPP">
  <meta name="format-detection" content="telephone=no">
  <meta name="application-name" content="TamalitosAPP">

  <!-- theme-color: color de la barra de navegación del navegador (dinámico) -->
  <meta name="theme-color" content="#ffffff">

  <!-- ── Web App Manifest ── -->
  <link rel="manifest" href="./manifest.json">

  <!-- ── Iconos para iOS ──
       Safari exige PNG para apple-touch-icon — SVG no es soportado.
       El tamaño canónico es 180x180 para iPhone Retina.             -->
  <link rel="apple-touch-icon"            href="./icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

  <!-- ── Iconos para otros navegadores ── -->
  <link rel="icon" type="image/svg+xml"   href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">

  <!-- ── Design System CSS (orden de carga importa) ── -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/views.css">
</head>
<body>

  <!--
    SHELL ÚNICO DE LA SPA
    ─────────────────────
    #app es el único contenedor que cambia de contenido.
    El router inyecta/reemplaza los hijos de este div al navegar.

    Nota: body está `position: fixed` (ver base.css) para prevenir
    el bounce/elastic scroll de iOS Standalone y el pull-to-refresh.
    El scroll real ocurre AQUÍ dentro, no en el body.
  -->
  <div id="app" role="main" aria-live="polite">
    <!-- Vista de carga inicial -->
    <div class="view" style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1rem;
    ">
      <div style="font-size: 3rem;">🫔</div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!--
    CONTENEDOR DE TOASTS
    Se monta automáticamente por toast.js al primer uso.
    Lo declaramos aquí para mayor claridad.
  -->
  <div class="toast-container" id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!--
    BOOTSTRAP DE LA APP
    type="module" habilita:
      - import/export ES6 nativo (soportado en iOS Safari 10.1+)
      - Scope de módulo (sin contaminación global)
      - Defer automático (ejecuta después de parsear el DOM)
  -->
  <script type="module" src="./js/app.js"></script>

</body>
</html>
