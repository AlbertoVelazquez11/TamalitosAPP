name = "tamalitosapp-telegram-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Orígenes permitidos para CORS, separados por coma.
# Vacío = permite cualquier origen (solo para pruebas).
# En producción, poné el origen de tu PWA, ej:
#   CORS_ALLOWED_ORIGINS = "https://tamalitosapp.vercel.app"
[vars]
CORS_ALLOWED_ORIGINS = ""

# Bucket R2 para sincronización de respaldos.
# Crearlo con: npx wrangler r2 bucket create tamalitosapp-backups
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "tamalitosapp-backups"
